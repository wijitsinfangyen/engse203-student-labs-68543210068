# Standalone LAB11 CI example. The running monorepo workflow is .github/workflows/labs.yml.
name: LAB11 production verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/week-11/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test --prefix api
      - run: node --disable-warning=ExperimentalWarning check-week11.mjs
