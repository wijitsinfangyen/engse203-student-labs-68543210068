<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENGSE203 LAB 3</title>
  <script type="module" crossorigin src="./assets/index-icl3yFbu.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-6jxIwqpG.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">ENGSE203 • LAB 3</p>
      <h1>Campus Service Request</h1>
      <p>Responsive Web UI, Event and Form</p>
    </div>
  </header>

  <main class="container page-grid">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Create Service Request</h2>
      
      <form id="request-form" novalidate>
        <!-- TODO 1: Requester Name field -->
        <div class="form-group">
          <label for="requester-name">ชื่อผู้แจ้ง</label>
          <input 
            type="text" 
            id="requester-name" 
            name="requesterName" 
            placeholder="ระบุชื่อ-นามสกุล"
            aria-describedby="name-hint name-error"
            required 
          />
          <small id="name-hint" class="hint-text">อย่างน้อย 2 ตัวอักษร</small>
          <p id="name-error" class="error-text" role="alert"></p>
        </div>

        <!-- TODO 2: Request Type select -->
        <div class="form-group">
          <label for="request-type">ประเภทบริการ</label>
          <select 
            id="request-type" 
            name="requestType" 
            aria-describedby="type-hint type-error"
            required
          >
            <option value="" disabled selected>-- เลือกประเภทบริการ --</option>
            <option value="IT Support">IT Support (คอมพิวเตอร์ / อินเทอร์เน็ต)</option>
            <option value="Maintenance">Maintenance (ซ่อมบำรุงอาคาร/อุปกรณ์)</option>
            <option value="Cleaning">Cleaning (ทำความสะอาด)</option>
            <option value="General">General (สอบถาม / เรื่องทั่วไป)</option>
          </select>
          <small id="type-hint" class="hint-text">กรุณาเลือกประเภทคำร้อง</small>
          <p id="type-error" class="error-text" role="alert"></p>
        </div>

        <!-- TODO 3: Details textarea -->
        <div class="form-group">
          <label for="request-details">รายละเอียดคำร้อง</label>
          <textarea 
            id="request-details" 
            name="requestDetails" 
            rows="4" 
            placeholder="เช่น ต้องการให้ซ่อมเครื่องปรับอากาศในห้องเรียน"
            aria-describedby="details-hint details-error"
            required
          ></textarea>
          <div class="field-footer">
            <small id="details-hint" class="hint-text">อย่างน้อย 10 ตัวอักษร</small>
            <small id="char-count" class="char-count">0 ตัวอักษร</small>
          </div>
          <p id="details-error" class="error-text" role="alert"></p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Submit Request</button>
          <button type="reset" id="reset-btn" class="btn btn-secondary">เริ่มใหม่</button>
        </div>

        <p id="form-status" class="status" role="status"></p>
      </form>
    </section>

    <aside class="panel preview-panel" aria-labelledby="preview-title">
      <h2 id="preview-title">Live Preview</h2>
      
      <div class="preview-card">
        <dl id="preview" aria-live="polite">
          <div class="preview-item">
            <dt>Name</dt>
            <dd id="preview-name">ยังไม่ระบุชื่อ</dd>
          </div>
          <div class="preview-item">
            <dt>Type</dt>
            <dd id="preview-type">ยังไม่เลือกประเภท</dd>
          </div>
          <div class="preview-item">
            <dt>Details</dt>
            <dd id="preview-details">ยังไม่มีรายละเอียด</dd>
          </div>
        </dl>
      </div>

      <h3 class="section-subtitle">Submitted Requests</h3>
      <ul id="request-list" class="request-list"></ul>
    </aside>
  </main>
</body>
</html>
