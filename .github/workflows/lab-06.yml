name: LAB06
on:
  pull_request:
    paths: ['labs/week-06/**', 'docs/labs/week-06/**', '.github/workflows/lab-06.yml']
  push:
    branches: [main]
    paths: ['labs/week-06/**', 'docs/labs/week-06/**', '.github/workflows/lab-06.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-06-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: labs/week-06/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install this LAB only
        run: |
          foreach ($folder in @('.', 'api', 'frontend')) {
            if (Test-Path "$folder/package.json") {
              if (Test-Path "$folder/package-lock.json") { npm.cmd ci --prefix $folder --no-fund }
              else { npm.cmd install --prefix $folder --no-fund }
              if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
            }
          }
      - name: Build and test this LAB
        run: |
          Write-Output 'This LAB uses CLI/SQLite checks instead of a frontend build.'
      - name: Instructor checker
        run: |
          $env:NODE_NO_WARNINGS = '1'
          $output = (& npm.cmd run check 2>&1 | Out-String)
          $result = $LASTEXITCODE
          Write-Output $output
          $output | Set-Content -Encoding utf8 ../evidence/split-ci-checker.txt
          if ($result -ne 0) { throw 'Checker process failed' }
          $mandatory = $output -split '\r?\n' | Where-Object { ($_ -match '\[TODO\]') -and ($_ -notmatch '\[TODO\]\s+CHAL') }
          if ($mandatory -or $output -match '(?m)\[FAIL\]|^FAIL\b|❌') { throw 'Mandatory checkpoint failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-06-evidence
          path: labs/week-06/evidence/
